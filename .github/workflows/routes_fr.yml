name: Routes France
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Outils
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          pip install --break-system-packages osmium numpy || pip install osmium numpy
      - name: Données OpenStreetMap de la France
        run: curl -fL --retry 3 -o fr.osm.pbf https://download.geofabrik.de/europe/france-latest.osm.pbf
      - name: Extraction des routes (autoroutes à routes tertiaires)
        run: |
          osmium tags-filter fr.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link -o roads.osm.pbf
          rm fr.osm.pbf
          ls -lh roads.osm.pbf
      - name: Tuiles de routage pour le simulateur
        run: |
          cat > build_roads_fr.py <<'PY'
          """Réseau routier français (OSM, autoroutes → routes tertiaires) -> tuiles de routage 1° pour le simulateur.
          Sortie : out/rf/<x>_<y>.json, out/rf/index.json, out/roads_fr.json (aperçu des grands axes)."""
          import json, math, os, re, sys
          import numpy as np
          
          OUT = os.environ.get('OUT', 'out')
          TS = 1.0                 # tuiles de 1° (peu de fichiers)
          OFF = 50_000_000         # identifiants de nœuds distincts du réseau suisse
          TOL = 12.0               # simplification des tracés (m)
          CLS = {'motorway': 0, 'motorway_link': 1, 'trunk': 2, 'trunk_link': 3, 'primary': 4, 'primary_link': 4,
                 'secondary': 5, 'secondary_link': 5, 'tertiary': 6, 'tertiary_link': 6}
          
          def num_speed(v):
              if not v: return 0
              m = re.match(r'(\d+)', v)
              if m: return min(130, int(m.group(1)))
              v = v.lower()
              if 'urban' in v: return 50
              if 'rural' in v: return 80
              if 'motorway' in v: return 130
              return 0
          
          def way_entry(tags, refs, la, lo):
              c = CLS.get(tags.get('highway'))
              if c is None or len(refs) < 2: return None
              ow = tags.get('oneway', '')
              o = 1 if ow in ('yes', '1', 'true') else (-1 if ow == '-1' else 0)
              if o == 0 and tags.get('junction') in ('roundabout', 'circular') and ow != 'no': o = 1
              if o == 0 and c == 0 and ow != 'no': o = 1
              if o == -1: refs, la, lo = refs[::-1], la[::-1], lo[::-1]; o = 1
              return (c, o, num_speed(tags.get('maxspeed', '')), tags.get('name') or tags.get('ref') or '',
                      np.asarray(refs, dtype=np.int64), np.asarray(la, dtype=np.float64), np.asarray(lo, dtype=np.float64))
          
          def read_pbf(path):
              import osmium
              ways = []
              class H(osmium.SimpleHandler):
                  def way(self, w):
                      refs, la, lo = [], [], []
                      for n in w.nodes:
                          if not n.location.valid(): continue
                          refs.append(n.ref); la.append(n.location.lat); lo.append(n.location.lon)
                      e = way_entry({k: w.tags.get(k) or '' for k in ('highway', 'oneway', 'junction', 'maxspeed', 'name', 'ref')}, refs, la, lo)
                      if e: ways.append(e)
              H().apply_file(path, locations=True, idx='flex_mem')
              return ways
          
          def dp(x, y, tol):
              n = len(x)
              if n <= 2: return np.array([0, n - 1])
              keep = np.zeros(n, dtype=bool); keep[0] = keep[-1] = True
              stack = [(0, n - 1)]
              while stack:
                  i, j = stack.pop()
                  if j - i < 2: continue
                  ax, ay, bx, by = x[i], y[i], x[j], y[j]
                  dx, dy = bx - ax, by - ay; L = dx * dx + dy * dy
                  px, py = x[i + 1:j], y[i + 1:j]
                  if L == 0: d = (px - ax) ** 2 + (py - ay) ** 2
                  else:
                      t = np.clip(((px - ax) * dx + (py - ay) * dy) / L, 0, 1)
                      d = (px - ax - t * dx) ** 2 + (py - ay - t * dy) ** 2
                  k = int(np.argmax(d))
                  if d[k] > tol * tol:
                      k += i + 1; keep[k] = True; stack += [(i, k), (k, j)]
              return np.nonzero(keep)[0]
          
          def build(ways):
              print('chemins', len(ways), flush=True)
              allrefs = np.concatenate([w[4] for w in ways])
              alllat = np.concatenate([w[5] for w in ways]); alllng = np.concatenate([w[6] for w in ways])
              uniq, inv = np.unique(allrefs, return_inverse=True)
              LAT = np.empty(len(uniq)); LNG = np.empty(len(uniq)); LAT[inv] = alllat; LNG[inv] = alllng
              del allrefs, alllat, alllng
              offs = np.cumsum([0] + [len(w[4]) for w in ways])
              cnt = np.bincount(inv, minlength=len(uniq)).astype(np.int32)
              np.add.at(cnt, inv[offs[:-1]], 1); np.add.at(cnt, inv[offs[1:] - 1], 1)
              junction = cnt >= 2
              J = np.nonzero(junction)[0]; jid = -np.ones(len(uniq), dtype=np.int64); jid[J] = np.arange(len(J))
              print('nœuds', len(uniq), 'jonctions', len(J), flush=True)
              E = []
              for wi, (c, o, s, n, refs, la, lo) in enumerate(ways):
                  idx = inv[offs[wi]:offs[wi + 1]]
                  cut = np.nonzero(junction[idx])[0]
                  for a, b in zip(cut[:-1], cut[1:]):
                      seg = idx[a:b + 1]
                      if seg[0] != seg[-1] or len(seg) > 2: E.append((jid[seg[0]], jid[seg[-1]], c, o, s, n, seg))
              print('arêtes', len(E), flush=True)
              # composantes connexes (union-find)
              parent = np.arange(len(J))
              def find(x):
                  r = x
                  while parent[r] != r: r = parent[r]
                  while parent[x] != r: parent[x], x = r, parent[x]
                  return r
              for a, b, *_ in E:
                  ra, rb = find(a), find(b)
                  if ra != rb: parent[ra] = rb
              roots = np.array([find(i) for i in range(len(J))])
              vals, counts = np.unique(roots, return_counts=True)
              inmain = np.isin(roots, vals[counts >= 40])
              tiles = {}
              def T(k):
                  if k not in tiles: tiles[k] = {'n': [], 'e': [], 'names': {}}
                  return tiles[k]
              for g, ni in enumerate(J):
                  T((math.floor(LNG[ni] / TS), math.floor(LAT[ni] / TS)))['n'].append(g)
              over = {}
              for a, b, c, o, s, n, seg in E:
                  la, lo = LAT[seg], LNG[seg]
                  kx = 111320 * math.cos(math.radians(la[0])); ky = 110950
                  x, y = lo * kx, la * ky
                  keep = dp(x, y, TOL)
                  q = np.stack([np.round(la[keep] * 1e5), np.round(lo[keep] * 1e5)], 1).astype(np.int64)
                  L = int(round(float(np.sum(np.hypot(np.diff(x), np.diff(y))))))
                  t = T((math.floor(lo[0] / TS), math.floor(la[0] / TS)))
                  nm = t['names'].setdefault(n, len(t['names'])) if n else -1
                  r = 1 if (inmain[a] and inmain[b]) else 0
                  t['e'].append((int(a) + OFF, int(b) + OFF, c * 2 + o, s, L, nm, r, q))
                  if c <= 4:
                      k2 = dp(x, y, 120.0)
                      over.setdefault(c, []).append(np.stack([np.round(la[k2] * 1e5), np.round(lo[k2] * 1e5)], 1).astype(np.int64))
              os.makedirs(f'{OUT}/rf', exist_ok=True)
              index, total = [], 0
              for (tx, ty), t in tiles.items():
                  oy, ox = int(round(ty * TS * 1e5)), int(round(tx * TS * 1e5))
                  nodes = []
                  for g in t['n']:
                      ni = J[g]; nodes += [int(g) + OFF, int(round(LAT[ni] * 1e5)) - oy, int(round(LNG[ni] * 1e5)) - ox]
                  edges = []
                  for a, b, co, s, L, nm, r, q in t['e']:
                      d = np.diff(np.vstack([[oy, ox], q]), axis=0).ravel().tolist()
                      edges.append([a, b, co, s, L, nm, r, d])
                  names = [None] * len(t['names'])
                  for n, i in t['names'].items(): names[i] = n
                  js = json.dumps({'o': [oy, ox], 'n': nodes, 'e': edges, 'nm': names, 'f': 1}, separators=(',', ':'), ensure_ascii=False)
                  open(f'{OUT}/rf/{tx}_{ty}.json', 'w', encoding='utf-8').write(js)
                  total += len(js); index.append([tx, ty, len(edges)])
              json.dump({'ts': TS, 't': index, 'off': OFF}, open(f'{OUT}/rf/index.json', 'w'))
              print('tuiles', len(index), 'taille', total // 1048576, 'Mo', flush=True)
              ov = {}
              for c, ls in over.items():
                  ov[str(c)] = [np.diff(np.vstack([[0, 0], l]), axis=0).ravel().tolist() for l in ls]
              s = json.dumps(ov, separators=(',', ':'))
              open(f'{OUT}/roads_fr.json', 'w').write(s)
              print('aperçu', len(s) // 1024, 'Ko', flush=True)
          
          if __name__ == '__main__':
              if len(sys.argv) > 1 and sys.argv[1].endswith('.pkl'):
                  import pickle   # essai local : réseau suisse déjà extrait
                  ids, LA, LO, raw = pickle.load(open(sys.argv[1], 'rb'))
                  ways = []
                  for wid, tags, nds in raw:
                      if CLS.get(tags.get('highway')) is None: continue
                      idx = np.searchsorted(ids, np.array(nds, dtype=np.int64)); idx = np.clip(idx, 0, len(ids) - 1)
                      ok = ids[idx] == np.array(nds, dtype=np.int64); idx = idx[ok]
                      e = way_entry(tags, ids[idx].tolist(), LA[idx].tolist(), LO[idx].tolist())
                      if e: ways.append(e)
                  build(ways)
              else:
                  build(read_pbf(sys.argv[1] if len(sys.argv) > 1 else 'roads.osm.pbf'))
          PY
          OUT=out python3 build_roads_fr.py roads.osm.pbf
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && zip -qr routes_fr.zip rf roads_fr.json && ls -lh routes_fr.zip
          gh release delete routes-fr --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create routes-fr routes_fr.zip --repo "$GITHUB_REPOSITORY" --title "Routes France" --notes "Réseau routier français, autoroutes à routes tertiaires (OpenStreetMap, ODbL)"
